name: Feature idea
description: Suggest an idea or enhancement for Pix
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new animation, interaction, or feature? Let us know!
  - type: textarea
    id: idea
    attributes:
      label: What is your idea?
      description: Describe the feature or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: How would it fit into Pix?
      description: Why would this be a great addition to Pix?
